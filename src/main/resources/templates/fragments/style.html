<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<style th:fragment="estilos">

    /* ═══════════════════════════════════════════════════
       VARIABLES CENTRALES — cambia aquí para todo el sitio
    ═══════════════════════════════════════════════════ */
    :root {
        --primary:       #2563eb;   /* azul principal */
        --primary-dark:  #1d4ed8;   /* hover botones */
        --primary-light: #eff6ff;   /* fondos suaves */
        --primary-border:#bfdbfe;   /* bordes suaves */

        --success:       #16a34a;
        --success-light: #f0fdf4;
        --success-border:#bbf7d0;

        --warning:       #d97706;
        --warning-light: #fffbeb;
        --warning-border:#fde68a;

        --danger:        #dc2626;
        --danger-light:  #fef2f2;
        --danger-border: #fecaca;

        --info:          #0891b2;
        --info-light:    #ecfeff;
        --info-border:   #a5f3fc;

        --gray-50:  #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;
        --gray-700: #374151;
        --gray-900: #111827;

        --bg:       #ffffff;        /* fondo de página */
        --surface:  #ffffff;        /* fondo de cards */
        --border:   #e5e7eb;

        --radius:   10px;
        --radius-sm: 6px;
        --shadow:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
        --shadow-md:0 4px 12px rgba(0,0,0,.08);

        --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--gray-900);
        font-size: 14px;
        line-height: 1.6;
        min-height: 100vh;
    }

    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-dark); }

    /* ── Navbar ── */
    .navbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 32px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: var(--shadow);
    }

    .navbar-brand {
        font-size: 17px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: -0.3px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .navbar-links {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .navbar-links a {
        color: var(--gray-500);
        font-size: 13.5px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        transition: all .15s;
    }

    .navbar-links a:hover {
        color: var(--primary);
        background: var(--primary-light);
    }

    .navbar-links a.active {
        color: var(--primary);
        background: var(--primary-light);
    }

    .btn-logout {
        color: var(--danger) !important;
        margin-left: 8px !important;
    }

    .btn-logout:hover {
        background: var(--danger-light) !important;
        color: var(--danger) !important;
    }

    /* ── Container ── */
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px;
    }

    /* ── Page header ── */
    .page-header {
        margin-bottom: 28px;
    }

    .page-header h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--gray-900);
        letter-spacing: -0.3px;
    }

    .page-header p {
        color: var(--gray-500);
        font-size: 13.5px;
        margin-top: 4px;
    }

    /* ── Card ── */
    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
    }

    .card-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--gray-900);
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* ── Stats grid ── */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
    }

    .stat-card .number {
        font-size: 32px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1;
    }

    .stat-card .label {
        font-size: 12px;
        color: var(--gray-500);
        margin-top: 6px;
        font-weight: 500;
    }

    .stat-card.danger .number { color: var(--danger); }
    .stat-card.success .number { color: var(--success); }
    .stat-card.warning .number { color: var(--warning); }

    /* ── Buttons ── */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all .15s;
        text-decoration: none;
        white-space: nowrap;
        line-height: 1;
    }

    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-dark); color: #fff; }

    .btn-success {
        background: var(--success);
        color: #fff;
        border-color: var(--success);
    }
    .btn-success:hover { color: #fff; }

    .btn-danger {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
    }
    .btn-danger:hover { color: #fff; }

    .btn-warning {
        background: var(--warning);
        color: #fff;
        border-color: var(--warning);
    }
    .btn-warning:hover { color: #fff; }

    .btn-info {
        background: var(--info);
        color: #fff;
        border-color: var(--info);
    }
    .btn-info:hover { color: #fff; }

    .btn-outline {
        background: transparent;
        color: var(--primary);
        border-color: var(--primary-border);
    }
    .btn-outline:hover {
        background: var(--primary-light);
        color: var(--primary);
    }

    .btn-ghost {
        background: transparent;
        color: var(--gray-500);
        border-color: var(--border);
    }
    .btn-ghost:hover {
        background: var(--gray-100);
        color: var(--gray-700);
    }

    .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
    }

    /* ── Tabla ── */
    .table-wrap { overflow-x: auto; }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
    }

    thead tr {
        border-bottom: 2px solid var(--border);
    }

    th {
        text-align: left;
        padding: 10px 14px;
        font-size: 11px;
        font-weight: 600;
        color: var(--gray-500);
        text-transform: uppercase;
        letter-spacing: .5px;
        white-space: nowrap;
    }

    td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--gray-100);
        color: var(--gray-700);
        vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--gray-50); }

    .td-actions { display: flex; gap: 6px; align-items: center; }

    /* ── Forms ── */
    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .form-group label {
        font-size: 12px;
        font-weight: 600;
        color: var(--gray-500);
        text-transform: uppercase;
        letter-spacing: .4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13.5px;
        color: var(--gray-900);
        background: var(--surface);
        transition: border-color .15s, box-shadow .15s;
        font-family: var(--font);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .form-hint {
        font-size: 11.5px;
        color: var(--gray-400);
        margin-top: 2px;
    }

    /* ── Alerts ── */
    .alert {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        margin-bottom: 16px;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid;
    }

    .alert-success {
        background: var(--success-light);
        color: var(--success);
        border-color: var(--success-border);
    }

    .alert-danger {
        background: var(--danger-light);
        color: var(--danger);
        border-color: var(--danger-border);
    }

    .alert-warning {
        background: var(--warning-light);
        color: var(--warning);
        border-color: var(--warning-border);
    }

    .alert-info {
        background: var(--info-light);
        color: var(--info);
        border-color: var(--info-border);
    }

    /* ── Badges ── */
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
        border: 1px solid;
    }

    .badge-success {
        background: var(--success-light);
        color: var(--success);
        border-color: var(--success-border);
    }

    .badge-danger {
        background: var(--danger-light);
        color: var(--danger);
        border-color: var(--danger-border);
    }

    .badge-warning {
        background: var(--warning-light);
        color: var(--warning);
        border-color: var(--warning-border);
    }

    .badge-info {
        background: var(--info-light);
        color: var(--info);
        border-color: var(--info-border);
    }

    .badge-primary {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary-border);
    }

    /* ── Divider ── */
    .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
    }

    /* ── Section title (resolución) ── */
    .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: .6px;
        margin: 24px 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    /* ── Competencia card (resultados) ── */
    .comp-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }

    .comp-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        background: var(--gray-50);
    }

    .comp-card .comp-name {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--gray-500);
        text-transform: uppercase;
        letter-spacing: .4px;
        margin-bottom: 8px;
    }

    .comp-card .comp-score {
        font-size: 30px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1;
    }

    .comp-card .comp-level {
        font-size: 12px;
        color: var(--gray-400);
        margin-top: 4px;
    }

    /* ── Score banner ── */
    .score-banner {
        background: var(--primary);
        border-radius: var(--radius);
        padding: 32px;
        text-align: center;
        color: white;
        margin-bottom: 20px;
    }

    .score-banner .score-num {
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
    }

    .score-banner .score-label {
        font-size: 14px;
        opacity: .8;
        margin-top: 6px;
    }

    .score-banner .score-badge {
        display: inline-block;
        margin-top: 14px;
        background: rgba(255,255,255,.2);
        padding: 5px 16px;
        border-radius: 20px;
        font-size: 13px;
    }

    /* ── Info row (datos estudiante) ── */
    .info-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }

    .info-item {
        padding: 12px;
        background: var(--gray-50);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
    }

    .info-item .info-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--gray-400);
        text-transform: uppercase;
        letter-spacing: .4px;
        margin-bottom: 4px;
    }

    .info-item .info-value {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--gray-900);
    }

    /* ── Empty state ── */
    .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: var(--gray-400);
    }

    .empty-state .empty-icon {
        font-size: 40px;
        margin-bottom: 12px;
    }

    .empty-state p {
        font-size: 13.5px;
    }

    /* ── Resolución ── */
    .res-header {
        text-align: center;
        padding-bottom: 24px;
        margin-bottom: 28px;
        border-bottom: 1px solid var(--border);
    }

    .res-header h2 {
        font-size: 20px;
        font-weight: 700;
        color: var(--gray-900);
    }

    .res-header p {
        color: var(--gray-500);
        font-size: 13px;
        margin-top: 4px;
    }

    .articulo {
        margin-bottom: 20px;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--primary);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        background: var(--gray-50);
    }

    .articulo h4 {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 8px;
    }

    .articulo p {
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--gray-700);
    }

    /* ── Comprobante ── */
    .comprobante {
        font-family: 'Courier New', monospace;
        background: var(--primary-light);
        color: var(--primary);
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12.5px;
        border: 1px solid var(--primary-border);
    }

    /* ── Quick access cards ── */
    .quick-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
    }

    .quick-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        text-align: center;
        color: var(--gray-700);
        transition: all .15s;
        font-size: 13px;
        font-weight: 500;
        background: var(--surface);
    }

    .quick-card:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-light);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .quick-card .quick-icon {
        font-size: 26px;
        display: block;
        margin-bottom: 8px;
    }

    /* ── Tabla resolución ── */
    .tabla-res thead tr { border-bottom: 2px solid var(--border); }
    .tabla-res th {
        background: var(--gray-50);
        color: var(--gray-500);
    }
    .nota-alta  { color: var(--success); font-weight: 700; }
    .nota-media { color: var(--warning); font-weight: 700; }
    .sin-ben    { color: var(--danger);  font-weight: 700; }

    /* ── Fila propia en tabla general ── */
    .fila-propia td { background: var(--primary-light) !important; }
    .fila-propia:hover td { background: #dbeafe !important; }

</style>
</head>
</html>
