<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Coordinador — Aprobar</title>
    <th:block th:replace="~{fragments/style :: estilos}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('COORDINADOR')}"></div>
<div class="container">

    <div class="page-header">
        <h1>Aprobar Saber Pro</h1>
        <p>Aprobación automática según puntaje. El pago debe estar aceptado.</p>
    </div>

    <div th:if="${exito}" class="alert alert-success">✓ <span th:text="${exito}"></span></div>
    <div th:if="${error}" class="alert alert-danger">⚠ <span th:text="${error}"></span></div>

    <div class="card">
        <div class="card-title">Resultados pendientes de aprobación</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Registro</th>
                        <th>Estudiante</th>
                        <th>Programa</th>
                        <th>Puntaje</th>
                        <th>Nivel</th>
                        <th>Beneficio</th>
                        <th>Pago</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${resultados}">
                        <td th:text="${r.numeroRegistro}"></td>
                        <td th:text="${r.estudiante != null ?
                            r.estudiante.nombreCompleto : '—'}"></td>
                        <td th:text="${r.estudiante != null ?
                            r.estudiante.programa : '—'}"></td>
                        <td>
                            <strong th:text="${r.puntajeTotal}"></strong>
                        </td>
                        <td th:text="${r.puntajeNivel}"></td>
                        <td>
                            <span th:if="${r.tieneBeneficio}"
                                  class="badge badge-success"
                                  th:text="${r.tipoBeneficio}"></span>
                            <span th:unless="${r.tieneBeneficio}"
                                  class="badge badge-danger">Sin beneficio</span>
                        </td>
                        <td>
                            <span th:if="${r.estudiante != null and r.estudiante.pagoSaberPro}"
                                  class="badge badge-success">Aceptado</span>
                            <span th:unless="${r.estudiante != null and r.estudiante.pagoSaberPro}"
                                  class="badge badge-warning">Pendiente</span>
                        </td>
                        <td>
                            <span th:if="${r.estudiante != null and r.estudiante.aprobadoSaberPro}"
                                  class="badge badge-success">Aprobado</span>
                            <span th:unless="${r.estudiante != null and r.estudiante.aprobadoSaberPro}"
                                  class="badge badge-warning">Pendiente</span>
                        </td>
                        <td>
                            <form th:action="@{/coordinador/aprobar/{id}(id=${r.estudiante.id})}"
                                  method="post">
                                <button type="submit" class="btn btn-primary btn-sm"
                                        th:disabled="${r.estudiante == null or
                                            !r.estudiante.pagoSaberPro}"
                                        onclick="return confirm('¿Aprobar?')">
                                    Aprobar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="9">
                            <div class="empty-state">
                                <div class="empty-icon">✅</div>
                                <p>No hay resultados cargados aún</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
